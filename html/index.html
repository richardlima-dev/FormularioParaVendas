<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venda seu Carro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container_pricipal">
    <div class="container_head">
      <h3 class="presentation_text">Cadastre seu veículo para vender mais rápido!</h3>
    </div>
    <div class="container_body">
      <div class="title_form">
        <p class="start_form">FORMULÁRIO</p>
      </div>
      <div class="title_main">
        <h1 class="text_main">Venda fácil seu carro!</h1>
        <p>Descreva as características e marque os opcionais que ele possui</p>
      </div>
      <div class="container_form">
        <form>
          <div class="box_input">
            <label for="title">
              Titulo do anúncio <span class="red">*</span>
            </label>
            <input 
            type="text" 
            name="title" 
            id="title" 
            class="block" 
            placeholder="Um titulo para anunciar seu carro">
          </div>
          <div class="box_input">
            <label for="price">
              Preço <span class="red">*</span>
            </label>
            <input 
            type="number"
            name="price"
            id="price"
            class="block"
            placeholder="Defina o preço">
          </div>
          <div class="box_input">
            <label for="description">
              Descrição
            </label>
            <textarea 
            name="description" 
            id="description" 
            placeholder="Aqui você coloca detalhes do veículo. Exemplo: possui um pequeno arranhão">
            </textarea>
          </div>
          <div class="box_input">
            <label for="mark">
              Marca
            </label>
            <input 
            type="text" 
            name="mark" 
            id="mark" 
            placeholder="Insira o fabricante">
          </div>
          <div class="box_input">
            <label for="model">
              Modelo
            </label>
            <input 
            type="text" 
            name="model" 
            id="model" 
            class="block" 
            placeholder="Modelo do veículo">
          </div>
          <div class="box_input">
            <label for="km">
              Kilometragem
            </label>
            <input 
            type="text" 
            name="km" 
            id="km" 
            class="block" 
            placeholder="Digite a kilometragem do veículo">
          </div>
          <div class="box_input">
            <label for="date">
              Data da compra
            </label>
            <input 
            type="date" 
            name="date" 
            id="date" 
            class="block">
          </div>
          <div class="box_input">
            <p>Tipo de câmbio</p>
            <input type="radio" name="manual" value="type_exchange">
            <label for="manual">Manual</label>
            <input type="radio" name="automatic" value="type_exchange">
            <label for="automatic">Automático</label>
          </div>
          <div class="box_input">
            <p>Opcionais</p>
            <ul class="select_optional">
              <li>
                <input type="checkbox" name="optional[]" id="airbag" value="airbag">
                <label for="airbag">Airbag</label>
              </li>
              <li>
                <input type="checkbox" name="optional[]" id="alarme" value="alarme">
                <label for="alarme">Alarme</label>
              </li>
              <li>
                <input type="checkbox" name="optional[]" id="ar_condicionado" value="ar_condicionado">
                <label for="ar_condicionado">Ar condicionado</label>
              </li>
              <li>
                <input type="checkbox" name="optional[]" id="camera" value="camera">
                <label for="camera">Câmera de Ré</label>
              </li>
            </ul>
            <ul class="select_optional">
              <li>
                <input type="checkbox" name="optional[]" id="assistant" value="assistant">
                <label for="assistant">Assistente de Pista</label>
              </li>
              <li>
                <input type="checkbox" name="optional[]" id="keyless" name="keyless">
                <label for="keyless">Partida Keyless</label>
              </li>
              <li>
                <input type="checkbox" name="optional[]" id="integration" value="integration">
                <label for="integration">Integração com Celular</label>
              </li>
              <li>
                <input type="checkbox" name="optinal[]" id="leather_bench" value="leather_bench">
                <label for="leather_bench">Banco de Couro</label>
              </li>
            </ul>
            <div class="box_input">
              <p>Fotos do Carro</p>
              <input type="file" multiple accept="image/png, image/jpg" name="pictures" id="pictures" required>
            </div>
            <input type="submit" value="send" class="btn_submit">
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
